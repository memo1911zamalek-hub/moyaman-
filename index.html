<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدي كرة القدم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx"></canvas>
<div class="lights"></div>
<div class="field"></div>

<main id="app">
  <!-- القائمة الرئيسية -->
  <section id="menu" class="screen show">
    <div class="ball-wrap"><div class="ball"></div><div class="shadow"></div></div>
    <h1>تحدي كرة القدم</h1>
    <p class="sub">خمّن اللاعب، تتبّع الانتقالات، واختبر معلوماتك.</p>

    <h3>القسم</h3>
    <div class="chips" id="cats">
      <button class="chip on" data-v="all">الكل</button>
      <button class="chip" data-v="guess">خمّن اللاعب</button>
      <button class="chip" data-v="transfer">الانتقالات</button>
      <button class="chip" data-v="general">أسئلة عامة</button>
    </div>

    <h3>المستوى</h3>
    <div class="chips" id="lvls">
      <button class="chip on" data-v="0">مختلط</button>
      <button class="chip" data-v="1">سهل</button>
      <button class="chip" data-v="2">متوسط</button>
      <button class="chip" data-v="3">صعب</button>
    </div>

    <button class="btn main" id="start">ابدأ المباراة</button>
    <p class="meta" id="count"></p>
    <p class="meta" id="bestMenu"></p>
  </section>

  <!-- شاشة اللعب -->
  <section id="game" class="screen">
    <div class="hud">
      <div class="stat"><b id="sScore">0</b><span>النقاط</span></div>
      <div class="stat"><b id="sQ">1/10</b><span>السؤال</span></div>
      <div class="stat"><b id="sStreak">0</b><span>سلسلة الفوز</span></div>
    </div>
    <div class="timer"><i id="bar"></i></div>

    <div class="card3d" id="card">
      <span class="tag" id="tag"></span>
      <h2 id="question"></h2>
      <div class="clues" id="clues"></div>
      <div class="tools">
        <button class="tool" id="hintBtn">تلميح</button>
        <button class="tool" id="fiftyBtn">حذف إجابتين</button>
      </div>
      <div class="opts" id="opts"></div>
      <button class="btn next" id="next">السؤال التالي</button>
    </div>
  </section>

  <!-- النتيجة -->
  <section id="end" class="screen">
    <div class="trophy">🏆</div>
    <h1 id="endTitle"></h1>
    <p class="big" id="endScore"></p>
    <p class="sub" id="endInfo"></p>
    <p class="meta" id="bestEnd"></p>
    <button class="btn main" id="again">العب مرة أخرى</button>
    <button class="btn ghost" id="home">القائمة الرئيسية</button>
  </section>
</main>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
